[build-system]
requires = ["setuptools>=77.0.3", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "asterisk-ai-voice-agent"
version = "0.1.2"
description = "Self-hosted AI voice agent for Asterisk. Streaming speech-to-text to LLM to text-to-speech over AudioSocket, with barge-in and correct 20 ms frame pacing."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Tahir Almas", email = "tahir@ictinnovations.com" }]
maintainers = [{ name = "ICT Innovations", email = "tahir@ictinnovations.com" }]
keywords = [
    "asterisk",
    "audiosocket",
    "voice-agent",
    "ai-voice-agent",
    "conversational-ai",
    "speech-to-text",
    "text-to-speech",
    "telephony",
    "voip",
    "sip",
    "pbx",
    "whisper",
    "piper",
    "elevenlabs",
    "anthropic",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Telecommunications Industry",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Communications :: Telephony",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Framework :: AsyncIO",
]
dependencies = [
    "httpx>=0.27",
    "pyyaml>=6.0",
    "numpy>=1.26",
    "anthropic>=0.40",
    "openai>=1.50",
    "piper-tts==1.2.0",
    "webrtcvad-wheels>=2.0.10",
]

[project.urls]
Homepage = "https://www.ictinnovations.com"
Source = "https://github.com/ictinnovations/asterisk-ai-voice-agent"
Documentation = "https://github.com/ictinnovations/asterisk-ai-voice-agent#readme"
Changelog = "https://github.com/ictinnovations/asterisk-ai-voice-agent/blob/main/CHANGELOG.md"
Issues = "https://github.com/ictinnovations/asterisk-ai-voice-agent/issues"
"Announcement" = "https://ictinnovations.com/asterisk-ai-voice-agent-audiosocket-open-source/"
"ICTContact AI Voice Agent" = "https://www.ictcontact.com/ai-voice-agent-contact-center/"

[project.scripts]
asterisk-ai-voice-agent = "asterisk_ai_voice_agent.agent:cli"

[tool.setuptools]
packages = ["asterisk_ai_voice_agent"]
