name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Byte-compile the package
        run: python -m compileall asterisk_ai_voice_agent
      - run: pip install pyyaml
      - name: YAML sanity
        run: |
          python -c "import yaml,sys; [yaml.safe_load(open(f)) for f in ['config.example.yaml','personas.example.yaml']]; print('yaml ok')"

  imports:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r requirements.txt
      # compileall never executes an import statement, so it cannot catch a
      # module that is referenced but missing from the tree. This can.
      - name: Import every module
        run: |
          python -c "from asterisk_ai_voice_agent import audiosocket, tools, stt, llm, tts, agent; print('imports ok')"
      - name: Behaviour - unregistered UUIDs are rejected
        run: python tests/test_allowlist.py
      - name: Behaviour - accepted AudioSocket connections have Nagle off
        run: python tests/test_nodelay.py
      - name: Behaviour - the word onset before VAD pickup is not clipped
        run: python tests/test_lookback.py
      - name: Behaviour - chan_websocket identity, pacing and barge-in
        run: python tests/test_websocket_transport.py

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install build twine
      - name: Build sdist and wheel
        run: python -m build
      - name: Validate metadata as PyPI will render it
        run: twine check --strict dist/*
      # Installing with --no-deps keeps this fast; the imports job already
      # proves the dependency set resolves.
      - name: Install the wheel and confirm the console script is wired up
        run: |
          pip install --no-deps dist/*.whl
          python -c "import asterisk_ai_voice_agent as p; print('version', p.__version__)"
          test -x "$(command -v asterisk-ai-voice-agent)"
          echo "entry point ok"
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
