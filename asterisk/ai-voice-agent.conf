; ============================================================================
;  asterisk-ai-voice-agent — Asterisk dialplan include
;  Bridges a channel to the AI sidecar via AudioSocket(uuid, host:port).
;
;  Install:
;    cp asterisk/ai-voice-agent.conf /etc/asterisk/
;    echo '#include "ai-voice-agent.conf"' >> /etc/asterisk/extensions.conf
;    asterisk -rx 'dialplan reload'
;
;  Derived from ICTContact (https://www.ictcontact.com).
;  ICT Innovations (https://www.ictinnovations.com) · ICT Vision (https://ict.vision)
; ============================================================================

[ai-agent-bridge]
; Entry: set PERSONA (and optionally AI_HOST/AI_PORT) before Goto here.
;   exten => _X.,1,Set(PERSONA=demo)
;    same => n,Goto(ai-agent-bridge,s,1)
exten => s,1,NoOp(== AI voice agent ENTER persona=${PERSONA} cid=${CALLERID(num)} uid=${UNIQUEID} ==)
 same => n,Answer()
 same => n,Wait(1)
 ; AudioSocket() requires a canonical 8-4-4-4-12 UUID. Derive one per call
 ; from UNIQUEID so the sidecar can correlate this connection.
 same => n,Set(__AI_HASH=${SHA1(${UNIQUEID})})
 same => n,Set(__AI_UUID=${AI_HASH:0:8}-${AI_HASH:8:4}-${AI_HASH:12:4}-${AI_HASH:16:4}-${AI_HASH:20:12})
 same => n,Set(__PERSONA=${IF($["${PERSONA}" = ""]?demo:${PERSONA})})
 same => n,Set(__AI_HOST=${IF($["${AI_HOST}" = ""]?127.0.0.1:${AI_HOST})})
 same => n,Set(__AI_PORT=${IF($["${AI_PORT}" = ""]?9092:${AI_PORT})})
 ; AudioSocket only carries the UUID, so pre-register the persona (and any
 ; call context) with the sidecar's small HTTP endpoint, keyed by the same
 ; UUID we hand AudioSocket. Fire-and-forget, short timeout so call setup
 ; isn't blocked. The sidecar HTTP port defaults to AudioSocket port - 1.
 same => n,System(/usr/bin/curl -s --max-time 2 -X POST "http://${AI_HOST}:9091/register" -H "Content-Type: application/json" -d "{\"uuid\":\"${AI_UUID}\",\"persona\":\"${PERSONA}\",\"caller\":\"${CALLERID(num)}\",\"uniqueid\":\"${UNIQUEID}\"}" >/dev/null 2>&1)
 same => n,NoOp(== AudioSocket UUID=${AI_UUID} persona=${PERSONA} -> ${AI_HOST}:${AI_PORT} ==)
 same => n,AudioSocket(${AI_UUID},${AI_HOST}:${AI_PORT})
 same => n,NoOp(== AudioSocket returned, hanging up ==)
 same => n,Hangup()

; Convenience: dial a persona by name for quick testing.
;   originate Local/demo@ai-agent-test extension demo@ai-agent-test
[ai-agent-test]
; _X. only matches digit-leading extens; persona names are alphabetic, so
; allow letters too or Local/demo@ai-agent-test never matches.
exten => _[a-zA-Z0-9].,1,NoOp(== AI voice agent quick test, persona=${EXTEN} ==)
 same => n,Set(PERSONA=${EXTEN})
 same => n,Goto(ai-agent-bridge,s,1)
